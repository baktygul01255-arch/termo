<script id="glyph-fix">
/* glyph-fix: на интерактивных досках без нужных шрифтов символы ⁰¹²…⁻, ₀₁₂…, ∛ показываются квадратиками.
   Заменяем их обычной разметкой <sup>/<sub> (в SVG — tspan со сдвигом, на canvas — рисуем уменьшенным шрифтом). */
(function(){
  const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺⁼⁽⁾ⁿⁱˣʸʳˢᐟ',SUPV='0123456789−+=()nixyrs/';
  const SUB='₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓ',SUBV='0123456789+−=()aeox';
  const RX=/([⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺⁼⁽⁾ⁿⁱˣʸʳˢᐟ]+)|([₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓ]+)|([∛∜])/g;
  const TEST=/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺⁼⁽⁾ⁿⁱˣʸʳˢᐟ₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓ∛∜]/;
  const conv=(s,A,B)=>s.split('').map(c=>{const i=A.indexOf(c);return i<0?c:B[i];}).join('');
  const plain=s=>conv(conv(s,SUP,SUPV),SUB,SUBV).replace(/∛/g,'3√').replace(/∜/g,'4√');
  function segs(s){const r=[];let last=0;s.replace(RX,(m,a,b,c,off)=>{if(off>last)r.push({t:s.slice(last,off),k:''});
      if(a)r.push({t:conv(a,SUP,SUPV),k:'sup'});else if(b)r.push({t:conv(b,SUB,SUBV),k:'sub'});else{r.push({t:c==='∛'?'3':'4',k:'sup'});r.push({t:'√',k:''});}
      last=off+m.length;return m;});if(last<s.length)r.push({t:s.slice(last),k:''});return r;}
  const SVGNS='http://www.w3.org/2000/svg',SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,OPTION:1,TITLE:1,title:1,NOSCRIPT:1};
  function fixText(t){const s=t.nodeValue;if(!s||!TEST.test(s))return;const p=t.parentNode;if(!p||SKIP[p.nodeName])return;
    const svg=p.namespaceURI===SVGNS;
    if(!svg&&(p.nodeName==='SUP'||p.nodeName==='SUB')){t.nodeValue=plain(s);return;}
    const f=document.createDocumentFragment();
    segs(s).forEach(g=>{if(!g.k){f.appendChild(document.createTextNode(g.t));return;}
      let e;if(svg){e=document.createElementNS(SVGNS,'tspan');e.setAttribute('baseline-shift',g.k==='sup'?'super':'sub');e.setAttribute('font-size','72%');}
      else e=document.createElement(g.k);
      e.textContent=g.t;f.appendChild(e);});
    p.replaceChild(f,t);}
  function walk(n){if(!n)return;if(n.nodeType===3){fixText(n);return;}if(n.nodeType!==1||SKIP[n.nodeName])return;
    const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),a=[];let x;while((x=w.nextNode()))if(TEST.test(x.nodeValue))a.push(x);a.forEach(fixText);}
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')fixText(m.target);else m.addedNodes.forEach(walk);}})
    .observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  document.addEventListener('DOMContentLoaded',()=>walk(document.body));
  /* canvas */
  const CP=CanvasRenderingContext2D.prototype,oF=CP.fillText,oS=CP.strokeText,oM=CP.measureText;
  function layout(ctx,s){const f=ctx.font,m=f.match(/(\d+(?:\.\d+)?)px/),fs=m?+m[1]:16,sm=m?f.replace(m[0],(fs*.7).toFixed(1)+'px'):f;
    const g=segs(s);let tot=0;g.forEach(q=>{ctx.font=q.k?sm:f;q.w=oM.call(ctx,q.t).width;tot+=q.w;});ctx.font=f;return{g,tot,f,sm,fs};}
  function draw(orig,ctx,s,x,y,mw){s=String(s);if(!TEST.test(s))return mw===undefined?orig.call(ctx,s,x,y):orig.call(ctx,s,x,y,mw);
    const Lo=layout(ctx,s);const al=ctx.textAlign,rtl=ctx.direction==='rtl';let x0=x;
    if(al==='center')x0=x-Lo.tot/2;else if(al==='right'||(al==='end'&&!rtl)||(al==='start'&&rtl))x0=x-Lo.tot;
    ctx.save();ctx.textAlign='left';Lo.g.forEach(q=>{ctx.font=q.k?Lo.sm:Lo.f;orig.call(ctx,q.t,x0,y+(q.k==='sup'?-Lo.fs*.36:q.k==='sub'?Lo.fs*.22:0));x0+=q.w;});ctx.restore();}
  CP.fillText=function(s,x,y,mw){return draw(oF,this,s,x,y,mw);};
  CP.strokeText=function(s,x,y,mw){return draw(oS,this,s,x,y,mw);};
  CP.measureText=function(s){s=String(s);const r=oM.call(this,s);if(!TEST.test(s))return r;const Lo=layout(this,s);
    return{width:Lo.tot,actualBoundingBoxLeft:r.actualBoundingBoxLeft,actualBoundingBoxRight:Lo.tot,actualBoundingBoxAscent:r.actualBoundingBoxAscent,actualBoundingBoxDescent:r.actualBoundingBoxDescent,fontBoundingBoxAscent:r.fontBoundingBoxAscent,fontBoundingBoxDescent:r.fontBoundingBoxDescent};};
})();
</script>

/* Layout: школьная тетрадь — красная линия полей, вкладки, слева текст учебника, справа рисунок/модель на клетчатой бумаге */
:root{
  --paper:#f6f7fb; --surface:#ffffff; --ink:#1c2746; --muted:#5b6582; --line:#d8ddea;

  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"PT Sans","Segoe UI",Arial,sans-serif;
  --f-math:"PT Serif",Georgia,serif;
  --f-mono:"PT Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c1:#6c84e0; --c2:#d9733c; --c3:#9470dc; --c4:#2fa463; color-scheme:dark}}

  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;

  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c1:#6c84e0; --c2:#d9733c; --c3:#9470dc; --c4:#2fa463; color-scheme:dark}

<script>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

  if(a>=1e5||a<1e-3){let e=Math.floor(Math.log10(a));let m=x/10**e;if(Math.abs(Math.round(m*100)/100)>=10){m/=10;e++;}return (trimN(m,sig-1).replace('.',',')+'·10'+sup(e)).replace('-','−');}
  const d=Math.max(0,sig-1-Math.floor(Math.log10(a)));return trimN(x,d).replace('.',',').replace('-','−');}
const frac=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;

/* ================= графики ================= */
function mkPlot(svg,o){const W=o.W,H=o.H,pl=o.pl||64,pr=o.pr||20,pt=o.pt||20,pb=o.pb||46;
  const X=x=>pl+(x-o.x0)/(o.x1-o.x0)*(W-pl-pr), Y=y=>H-pb-(y-o.y0)/(o.y1-o.y0)*(H-pt-pb);return{X,Y,W,H,pl,pr,pt,pb};}
function axes(svg,P,o){const{X,Y}=P;
  o.xt.forEach(v=>{el('line',{x1:X(v),x2:X(v),y1:Y(o.y0),y2:Y(o.y1),stroke:'var(--line)','stroke-width':1},svg);txt(svg,o.xf?o.xf(v):fmt(v),X(v),Y(o.y0)+24,{'text-anchor':'middle','font-size':16,fill:'var(--muted)'});});
  o.yt.forEach(v=>{el('line',{x1:X(o.x0),x2:X(o.x1),y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1},svg);txt(svg,o.yf?o.yf(v):fmt(v),X(o.x0)-8,Y(v)+5,{'text-anchor':'end','font-size':16,fill:'var(--muted)'});});
  el('line',{x1:X(o.x0),x2:X(o.x1)+8,y1:Y(o.y0),y2:Y(o.y0),stroke:'var(--muted)','stroke-width':2},svg);
  el('line',{x1:X(o.x0),x2:X(o.x0),y1:Y(o.y0),y2:Y(o.y1)-8,stroke:'var(--muted)','stroke-width':2},svg);
  txt(svg,o.xl,X(o.x1),Y(o.y0)-10,{'text-anchor':'end','font-size':18,'font-style':'italic',fill:'var(--muted)'});
  txt(svg,o.yl,X(o.x0)+8,Y(o.y1)+6,{'font-size':18,'font-style':'italic',fill:'var(--muted)'});}
function path(svg,pts,a){if(!pts.length)return;el('path',Object.assign({d:'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L'),fill:'none','stroke-width':3,'stroke-linejoin':'round'},a),svg);}

function svgStr(o,draw){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${o.W} ${o.H}`);s.setAttribute('class','plot');draw(s);return s.outerHTML;}
const nice=(mx,n=6)=>{const st=[0.1,0.2,0.25,0.5,1,2,5,10,20,25,50,100,200,250,500,1000];return st.find(s=>mx/s<=n)||1000;};
const ticks=(a,b,s)=>{const r=[];for(let v=a;v<=b+1e-9;v+=s)r.push(Math.round(v*1e6)/1e6);return r;};
const close=(x,y,tol)=>Math.abs(x-y)<=Math.max(Math.abs(y)*tol,1e-9);
const parseNum=s=>{s=String(s).replace(/\s/g,'').replace(',','.').replace('−','-');if(s===''||!isFinite(+s))return null;return +s;};



const neg=s=>String(s).replace(/^-/,'−');
function arr(svg,x1,y1,x2,y2,c,w,dash){const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy);if(l<3)return;w=w||3;const ux=dx/l,uy=dy/l,hs=Math.min(15,l*.45);
  const a={x1,y1,x2:x2-ux*hs*.8,y2:y2-uy*hs*.8,stroke:c,'stroke-width':w,'stroke-linecap':'round'};if(dash)a['stroke-dasharray']=dash;el('line',a,svg);
  el('path',{d:`M${x2.toFixed(1)} ${y2.toFixed(1)}L${(x2-ux*hs-uy*hs*.42).toFixed(1)} ${(y2-uy*hs+ux*hs*.42).toFixed(1)}L${(x2-ux*hs+uy*hs*.42).toFixed(1)} ${(y2-uy*hs-ux*hs*.42).toFixed(1)}Z`,fill:c},svg);}
/* универсальный график y(t) */
function kg(svg,o){const W=o.W||760,H=o.H||250;svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const T=o.T;
  let lo=o.lo,hi=o.hi;if(lo==null){lo=0;hi=0;o.series.forEach(s=>{for(let i=0;i<=200;i++){const y=s.f(T*i/200);if(isFinite(y)){lo=Math.min(lo,y);hi=Math.max(hi,y);}}});const pad=Math.max((hi-lo)*.12,.5);hi+=pad;if(lo<0)lo-=pad;}
  if(hi-lo<1e-9)hi=lo+1;
  const pl=o.pl||64,pr=34,pt=24,pb=30;const X=t=>pl+t/(T*1.04)*(W-pl-pr),Y=y=>pt+(hi-y)/(hi-lo)*(H-pt-pb);
  const sy=o.sy||nice(hi-lo,o.ny||5),st=o.st||nice(T,10);
  for(let v=Math.ceil(lo/sy)*sy;v<=hi+1e-9;v+=sy){const vv=Math.round(v*1e6)/1e6;el('line',{x1:X(0),x2:X(T*1.04),y1:Y(vv),y2:Y(vv),stroke:'var(--line)','stroke-width':1},svg);if(Math.abs(vv)>1e-9)txt(svg,fmt(vv),X(0)-8,Y(vv)+5,{'text-anchor':'end','font-size':15,fill:'var(--muted)'});}
  const y0=lo<=0&&hi>=0?Y(0):Y(lo);
  for(let t=st;t<=T*1.001;t+=st){const tt=Math.round(t*1e6)/1e6;el('line',{x1:X(tt),x2:X(tt),y1:Y(hi),y2:Y(lo),stroke:'var(--line)','stroke-width':1},svg);txt(svg,fmt(tt),X(tt),Math.min(H-6,y0+19),{'text-anchor':'middle','font-size':15,fill:'var(--muted)'});}
  txt(svg,'0',X(0)-8,y0+5,{'text-anchor':'end','font-size':15,fill:'var(--muted)'});
  if(o.area){const a=o.area,pts=[];const N=80;for(let i=0;i<=N;i++){const t=a.t0+(a.t1-a.t0)*i/N;pts.push(X(t).toFixed(1)+' '+Y(a.f(t)).toFixed(1));}
    el('path',{d:`M${X(a.t0)} ${Y(0)}L${pts.join('L')}L${X(a.t1)} ${Y(0)}Z`,fill:a.col||'var(--c1)','fill-opacity':.2,stroke:'none'},svg);}
  arr(svg,X(0),y0,W-8,y0,'var(--muted)',2);arr(svg,X(0),H-4,X(0),6,'var(--muted)',2);
  txt(svg,o.xl||L('t, с','t, с'),W-10,y0-9,{'text-anchor':'end','font-size':16,'font-style':'italic',fill:'var(--muted)'});txt(svg,o.yl||'',X(0)+10,18,{'font-size':16,'font-style':'italic',fill:'var(--muted)'});
  o.series.forEach(s=>{const pts=[];const N=240,t1=s.t1!=null?s.t1:T,t0=s.t0||0;for(let i=0;i<=N;i++){const t=t0+(t1-t0)*i/N;pts.push([X(t),Y(s.f(t))]);}path(svg,pts,{stroke:s.col||'var(--c1)','stroke-width':s.w||3.5,'stroke-dasharray':s.dash||'none'});
    if(s.lab){const t=s.lt!=null?s.lt:T*.92;txt(svg,s.lab,X(t),Y(s.f(t))-10,{'text-anchor':'middle','font-size':17,fill:s.col||'var(--c1)','font-weight':700});}});

    if(m.lab)txt(svg,m.lab,X(m.t)+(m.dx||8),Y(m.y)+(m.dy||-10),{'font-size':16,fill:m.col||'var(--c2)','font-weight':700,'text-anchor':m.anchor||'start'});});
  if(o.cur!=null){el('line',{x1:X(o.cur),x2:X(o.cur),y1:Y(hi),y2:Y(lo),stroke:'var(--ink)','stroke-width':1.5,'stroke-dasharray':'6 5'},svg);o.series.forEach(s=>{if(s.nocur)return;el('circle',{cx:X(o.cur),cy:Y(s.f(o.cur)),r:7,fill:s.col||'var(--c1)',stroke:'var(--surface)','stroke-width':2},svg);});}
  return{X,Y,lo,hi};}
/* мини-график для вариантов ответа */
function miniK(s,kind,yl){const W=240,H=170,ox=30,mid=kind.mid?85:140;arr(s,ox,H-6,ox,10,'var(--muted)',2);arr(s,ox-4,mid,W-8,mid,'var(--muted)',2);txt(s,'t',W-12,mid-8,{'text-anchor':'end','font-size':16,'font-style':'italic',fill:'var(--muted)'});if(yl)txt(s,yl,ox+8,22,{'font-size':16,'font-style':'italic',fill:'var(--muted)'});
  const pts=[];for(let t=0;t<=1.0001;t+=.02)pts.push([ox+t*185,mid-kind.f(t)*(kind.mid?65:115)]);path(s,pts,{stroke:'var(--c1)','stroke-width':3.5});}
const MK={lin0:{f:t=>.85*t},lin:{f:t=>.25+.6*t},const:{f:t=>.55},zero:{f:t=>0},parU:{f:t=>.9*t*t},parD:{f:t=>.9*(2*t-t*t)},down:{f:t=>.85-.75*t},
  cpos:{f:t=>.55,mid:1},cneg:{f:t=>-.55,mid:1},czero:{f:t=>0,mid:1},lmid:{f:t=>-.8+1.6*t,mid:1},ldown:{f:t=>.8-1.6*t,mid:1}};


/* ================= единицы и помощники ================= */
const RG=8.31;const JJ=L('Дж','Дж'),kJ=L('кДж','кДж'),MJ=L('МДж','МДж'),kPa=L('кПа','кПа'),Pa=L('Па','Па'),Lt=L('л','л'),KK='К',kgU=L('кг','кг'),WW=L('Вт','Вт'),kW=L('кВт','кВт'),mol=L('моль','моль'),ss=L('с','с');
const st=(why,mx)=>({why,mx});
function parseSci(s){s=String(s).replace(/\s/g,'').replace(/,/g,'.').replace(/[−–]/g,'-');if(s===''||!isFinite(+s))return null;return +s;}
const cell=(k,v)=>`<div><span class="k">${k}</span><span class="v">${v}</span></div>`;
function svg0(sv,W,H){sv.innerHTML='';sv.setAttribute('viewBox',`0 0 ${W} ${H}`);}
const FUEL=()=>[{n:L('бензин','бензин'),q:4.6e7,qh:'4,6·10⁷'},{n:L('дизельное топливо','дизель отыны'),q:4.2e7,qh:'4,2·10⁷'},{n:L('керосин','керосин'),q:4.6e7,qh:'4,6·10⁷'},{n:L('каменный уголь','тас көмір'),q:2.7e7,qh:'2,7·10⁷'},{n:L('природный газ','табиғи газ'),q:4.4e7,qh:'4,4·10⁷'}];
/* p–V диаграмма: o={W,H,V1,p1 (максимумы), segs:[{pts,col,w,dash,arrow}], fill, labels:[{V,p,t,dx,dy}], dot:[V,p], xl, yl} */

/* ================= МОДЕЛЬ 1: цикл ================= */
const CY={type:'rect',i:3,p1:100,p2:300,V1:2,V2:6,T1:600,T2:300,Va:1,Vb:2.5,nu:.1,s:0,run:false,raf:0};
function cyLegs(){const i=CY.i,g=(i+2)/i,nu=CY.nu,legs=[];
  if(CY.type==='rect'){const P=[[CY.V1,CY.p1],[CY.V1,CY.p2],[CY.V2,CY.p2],[CY.V2,CY.p1]];const nm=[PN().V,PN().p,PN().V,PN().p];
    for(let k=0;k<4;k++){const a=P[k],b=P[(k+1)%4];const dU=i/2*(b[0]*b[1]-a[0]*a[1]),A=(k%2?a[1]*(b[0]-a[0]):0);legs.push({n:`${k+1}→${k%4+2>4?1:k+2}`,name:nm[k],pts:lin(a,b,30),dU,A,Q:dU+A});}
    const T=P.map(([V,p])=>V*p/(nu*RG));return{legs,P,Tmax:Math.max(...T),Tmin:Math.min(...T)};}
  const T1=CY.T1,T2=CY.T2,V1=CY.Va,V2=CY.Vb,k=Math.pow(T1/T2,1/(g-1)),V3=V2*k,V4=V1*k,C1=nu*RG*T1,C2=nu*RG*T2;const P=[[V1,C1/V1],[V2,C1/V2],[V3,C2/V3],[V4,C2/V4]];
  const A12=C1*Math.log(V2/V1),A34=-C2*Math.log(V3/V4),Aad=i/2*nu*RG*(T1-T2);
  legs.push({n:'1→2',name:PN().T,pts:isoT(V1,V2,C1),dU:0,A:A12,Q:A12});legs.push({n:'2→3',name:PN().Q,pts:adia(V2,V3,C1/V2*Math.pow(V2,g),g),dU:-Aad,A:Aad,Q:0});legs.push({n:'3→4',name:PN().T,pts:isoT(V3,V4,C2),dU:0,A:A34,Q:A34});legs.push({n:'4→1',name:PN().Q,pts:adia(V4,V1,C2/V4*Math.pow(V4,g),g),dU:Aad,A:-Aad,Q:0});
  return{legs,P,Tmax:T1,Tmin:T2};}
function cyControls(){$('#yType').innerHTML=[['rect',L('Прямоугольный цикл (2 изохоры + 2 изобары)','Тікбұрышты цикл (2 изохора + 2 изобара)')],['carnot',L('Цикл Карно (2 изотермы + 2 адиабаты)','Карно циклі (2 изотерма + 2 адиабата)')]].map(([k,n])=>`<button data-t="${k}" aria-pressed="${CY.type===k}">${n}</button>`).join('');
  $('#yGas').innerHTML=[[3,L('одноатомный (i = 3)','бір атомды (i = 3)')],[5,L('двухатомный (i = 5)','екі атомды (i = 5)')]].map(([k,n])=>`<button data-i="${k}" aria-pressed="${CY.i===k}">${n}</button>`).join('');
  const sl=(k,n,lo,hi,stp,u)=>`<div class="sl"><span class="m">${n}</span><input type="range" data-k="${k}" min="${lo}" max="${hi}" step="${stp}" value="${CY[k]}"><span class="vl">${fmt(CY[k],3)} ${u}</span></div>`;
  $('#yCtl').innerHTML=CY.type==='rect'?sl('p1','p₁',50,250,10,kPa)+sl('p2','p₂',100,500,10,kPa)+sl('V1','V₁',1,4,.5,Lt)+sl('V2','V₂',3,10,.5,Lt):sl('T1','T₁',350,900,10,KK)+sl('T2','T₂',200,500,10,KK)+sl('Va','V₁',.5,2,.1,Lt)+sl('Vb','V₂',1,4,.1,Lt);
  $('#yBtns').innerHTML=`<button class="btn" data-a="go">${CY.run?L('⏸ Пауза','⏸ Үзіліс'):L('▶ Пройти цикл','▶ Циклден өту')}</button>`;
  $('#yTip').innerHTML=L('Газ: ν = 0,1 моль. Единицы подобраны так, что 1 кПа · 1 л = 1 Дж. Красные участки — газ получает теплоту (Q &gt; 0), синие — отдаёт (Q &lt; 0). Работа за цикл равна площади внутри цикла. КПД сравнивается с КПД цикла Карно для тех же наибольшей и наименьшей температур.','Газ: ν = 0,1 моль. Бірліктер 1 кПа · 1 л = 1 Дж болатындай таңдалған. Қызыл бөліктер — газ жылу алады (Q &gt; 0), көктері — береді (Q &lt; 0). Цикл ішіндегі жұмыс цикл ішіндегі ауданға тең. ПӘК сол ең үлкен және ең кіші температуралар үшін Карно циклінің ПӘК-імен салыстырылады.');}
function cyDraw(){if(CY.type==='rect'&&CY.p2<=CY.p1)CY.p2=CY.p1+10;if(CY.type==='rect'&&CY.V2<=CY.V1)CY.V2=CY.V1+.5;if(CY.type==='carnot'&&CY.T2>=CY.T1)CY.T2=CY.T1-10;if(CY.type==='carnot'&&CY.Vb<=CY.Va)CY.Vb=CY.Va+.1;
  const C=cyLegs();const all=[].concat(...C.legs.map(l=>l.pts));const Vm=Math.max(...all.map(p=>p[0]))*1.12,pm=Math.max(...all.map(p=>p[1]))*1.15;
  if(!isFinite(CY.s))CY.s=0;CY.s=((CY.s%4)+4)%4;const s=CY.s,frac_=CY.s-Math.floor(CY.s);const leg=C.legs[Math.min(3,Math.floor(s))];const dot=leg.pts[Math.min(leg.pts.length-1,Math.round(frac_*(leg.pts.length-1)))];
  pvFig($('#ySvg'),{W:600,H:420,V1:Vm,p1:pm,fill:all,segs:C.legs.map((l,k)=>({pts:l.pts,col:l.Q>1e-6?'#dc2626':l.Q<-1e-6?'#2563eb':'var(--muted)',w:Math.floor(s)===k?5:3.2})),labels:C.P.map((p,k)=>({V:p[0],p:p[1],t:String(k+1)})),dot});
  const Q1=C.legs.reduce((a,l)=>a+Math.max(0,l.Q),0),Q2=-C.legs.reduce((a,l)=>a+Math.min(0,l.Q),0),A=C.legs.reduce((a,l)=>a+l.A,0);const eta=A/Q1,ec=1-C.Tmin/C.Tmax;

function pFirst(){const P={cat:'first'};const mode=pick(['p','V','T','Q','gen']);const nu=pick([1,2,3,4,5]),dT=pick([10,20,40,50,100]);

    P.steps=[st(L('Работа газа:','Газдың жұмысы:'),`A′ = νRΔT = ${nu} · 8,31 · ${dT} = ${fmt(A,4)} ${JJ}`),st(L('Изменение внутренней энергии:','Ішкі энергияның өзгерісі:'),`ΔU = ${frac(3,2)}νRΔT = ${fmt(dU,4)} ${JJ}`),st(L('Первый закон термодинамики:','Термодинамиканың бірінші заңы:'),`Q = ΔU + A′ = ${fmt(Q,4)} ${JJ}`)];P.trap={v:dU,msg:L('Это только ΔU; при изобарном процессе газ ещё совершает работу.','Бұл тек ΔU; изобаралық процесте газ жұмыс та жасайды.')};P.wr=[dU,A,Q*2];
    P.fig=(svg,show)=>pvFig(svg,{V1:6,p1:300,segs:[{pts:lin([1.5,200],[4.5,200])}],fill:[[1.5,0],[1.5,200],[4.5,200],[4.5,0]],labels:[{V:1.5,p:200,t:'1'},{V:4.5,p:200,t:'2'}],note:show?`Q = ${fmt(Q,4)} ${JJ}`:'Q = ?',yf:()=>'',xf:()=>''});return P;}
  if(mode==='V'){const Q=1.5*nu*RG*dT;P.ans=Q;P.unit=JJ;P.text=L(`${nu} моль одноатомного газа в закрытом сосуде нагрели на ${dT} К. Какое количество теплоты сообщили газу?`,`Жабық ыдыстағы ${nu} моль бір атомды газды ${dT} К-ге қыздырды. Газға қандай жылу мөлшері берілді?`);P.given=`ν = ${nu} ${mol}, ΔT = ${dT} ${KK}, V = const`;
    P.steps=[st(L('Объём не меняется — работа равна нулю:','Көлем өзгермейді — жұмыс нөлге тең:'),`A′ = 0 &nbsp;⇒&nbsp; Q = ΔU`),st(L('Подставляем:','Мәндерді қоямыз:'),`Q = ${frac(3,2)}νRΔT = 1,5 · ${nu} · 8,31 · ${dT} = ${fmt(Q,4)} ${JJ}`)];P.trap={v:2.5*nu*RG*dT,msg:L('При V = const газ не совершает работу: Q = ΔU.','V = const болғанда газ жұмыс жасамайды: Q = ΔU.')};P.wr=[2.5*nu*RG*dT,nu*RG*dT,Q*2];}
  else if(mode==='T'){const A=pick([200,500,800,1000,1500]);P.ans=A;P.unit=JJ;P.text=L(`При изотермическом расширении газ совершил работу ${A} Дж. Какое количество теплоты он получил?`,`Изотермиялық ұлғаюда газ ${A} Дж жұмыс жасады. Ол қандай жылу мөлшерін алды?`);P.given=`T = const, A′ = ${A} ${JJ}`;
    P.steps=[st(L('При T = const внутренняя энергия идеального газа не меняется: ΔU = 0.','T = const болғанда идеал газдың ішкі энергиясы өзгермейді: ΔU = 0.'),`Q = ΔU + A′ = 0 + ${A} = ${A} ${JJ}`)];P.trap={v:0,msg:L('ΔU = 0, но Q = A′, а не нуль.','ΔU = 0, бірақ Q = A′, нөл емес.')};P.wr=[0,A*1.5,A/2];}
  else if(mode==='Q'){const A=pick([200,400,500,800,1000]);P.ans=-A;P.neg=true;P.unit=JJ;P.text=L(`При адиабатном расширении газ совершил работу ${A} Дж. Как изменилась его внутренняя энергия? (укажите ΔU со знаком)`,`Адиабаталық ұлғаюда газ ${A} Дж жұмыс жасады. Оның ішкі энергиясы қалай өзгерді? (ΔU-ны таңбасымен көрсетіңіз)`);P.given=`Q = 0, A′ = ${A} ${JJ}`;
    P.steps=[st(L('Адиабатный процесс — теплообмена нет: Q = 0.','Адиабаталық процесс — жылу алмасу жоқ: Q = 0.'),`0 = ΔU + A′ &nbsp;⇒&nbsp; ΔU = −A′ = −${A} ${JJ}`),st(L('Вывод:','Қорытынды:'),L('внутренняя энергия уменьшилась — газ охладился','ішкі энергия кеміді — газ суыды'))];P.trap={v:A,msg:L('Газ совершает работу за счёт своей внутренней энергии — ΔU &lt; 0.','Газ ішкі энергиясы есебінен жұмыс жасайды — ΔU &lt; 0.')};P.wr=[A,0,-2*A];}
  else{const Q=pick([500,800,1000,1500,2000]),A=pick([200,300,400,600]);const dU=Q-A;P.ans=dU;P.neg=true;P.unit=JJ;P.text=L(`Газу передали количество теплоты ${Q} Дж, при этом он совершил работу ${A} Дж. На сколько изменилась внутренняя энергия газа?`,`Газға ${Q} Дж жылу мөлшері берілді, бұл кезде ол ${A} Дж жұмыс жасады. Газдың ішкі энергиясы қаншаға өзгерді?`);P.given=`Q = ${Q} ${JJ}, A′ = ${A} ${JJ}`;
    P.steps=[st(L('Первый закон термодинамики:','Термодинамиканың бірінші заңы:'),`Q = ΔU + A′ &nbsp;⇒&nbsp; ΔU = Q − A′ = ${Q} − ${A} = ${dU} ${JJ}`)];P.trap={v:Q+A,msg:L('Газ сам совершает работу — она вычитается.','Газдың өзі жұмыс жасайды — ол азайтылады.')};P.wr=[Q+A,Q,A];}
  P.fig=(svg,show)=>figEngineBox(svg,show,P);
  return P;}
function figEngineBox(svg,show,P){svg0(svg,420,300);el('rect',{x:120,y:60,width:160,height:170,fill:'var(--accent-soft)',stroke:'var(--ink)','stroke-width':3},svg);el('rect',{x:120,y:60,width:160,height:16,fill:'var(--muted)'},svg);arr(svg,200,58,200,10,'var(--c4)',3);txt(svg,"A′",210,30,{'font-size':17,'font-style':'italic','font-weight':700,fill:'var(--c4)'});
  arr(svg,40,180,116,180,'#dc2626',4);txt(svg,'Q',46,168,{'font-size':17,'font-style':'italic','font-weight':700,fill:'#dc2626'});txt(svg,'ΔU',200,160,{'text-anchor':'middle','font-size':18,'font-style':'italic','font-weight':700});txt(svg,show?`${fmt(P.ans,4)} ${P.unit}`:'?',300,280,{'text-anchor':'middle','font-size':17,'font-weight':700,fill:'var(--c2)'});}
function pEta(){const P={cat:'eta'};const mode=pick(['eta','A','Q2','Q1']);const Q1=pick([100,200,400,500,800,1000]),e=pick([20,25,30,40,50]);const A=Q1*e/100,Q2=Q1-A;
  const base=L(`Тепловой двигатель за цикл получает от нагревателя ${Q1} кДж теплоты`,`Жылу қозғалтқышы цикл ішінде қыздырғыштан ${Q1} кДж жылу алады`);
  if(mode==='eta'){P.ans=e;P.unit='%';P.text=base+L(` и отдаёт холодильнику ${fmt(Q2)} кДж. Найдите КПД двигателя.`,` және суытқышқа ${fmt(Q2)} кДж береді. Қозғалтқыштың ПӘК-ін табыңыз.`);P.given=`Q₁ = ${Q1} ${kJ}, Q₂ = ${fmt(Q2)} ${kJ}`;
    P.steps=[st(L('КПД:','ПӘК:'),`η = ${frac('Q₁ − Q₂','Q₁')} = ${frac(`${Q1} − ${fmt(Q2)}`,Q1)} = ${fmt(e/100)} = ${e} %`)];P.trap={v:Q2/Q1*100,msg:L('η = (Q₁ − Q₂)/Q₁, а не Q₂/Q₁.','η = (Q₁ − Q₂)/Q₁, Q₂/Q₁ емес.')};P.wr=[Q2/Q1*100,100-e/2,e*2];}
  else if(mode==='A'){P.ans=A;P.unit=kJ;P.text=base+L(`; его КПД ${e} %. Какую работу он совершает за цикл?`,`; оның ПӘК-і ${e} %. Ол цикл ішінде қандай жұмыс жасайды?`);P.given=`Q₁ = ${Q1} ${kJ}, η = ${e} %`;
    P.steps=[st(L('Из η = A/Q₁:','η = A/Q₁ өрнегінен:'),`A = ηQ₁ = ${fmt(e/100)} · ${Q1} = ${fmt(A)} ${kJ}`)];P.trap={v:Q2,msg:L('Это теплота, отданная холодильнику.','Бұл суытқышқа берілген жылу.')};P.wr=[Q2,Q1*e,Q1/e];}
  else if(mode==='Q2'){P.ans=Q2;P.unit=kJ;P.text=base+L(` и совершает работу ${fmt(A)} кДж. Какое количество теплоты он отдаёт холодильнику?`,` және ${fmt(A)} кДж жұмыс жасайды. Ол суытқышқа қандай жылу мөлшерін береді?`);P.given=`Q₁ = ${Q1} ${kJ}, A = ${fmt(A)} ${kJ}`;
    P.steps=[st(L('Закон сохранения энергии для цикла:','Цикл үшін энергияның сақталу заңы:'),`Q₂ = Q₁ − A = ${Q1} − ${fmt(A)} = ${fmt(Q2)} ${kJ}`)];P.trap={v:Q1+A,msg:L('Q₂ = Q₁ − A.','Q₂ = Q₁ − A.')};P.wr=[Q1+A,A,Q1];}
  else{P.ans=Q1;P.unit=kJ;P.text=L(`КПД теплового двигателя ${e} %, за цикл он совершает работу ${fmt(A)} кДж. Какое количество теплоты двигатель получает от нагревателя за цикл?`,`Жылу қозғалтқышының ПӘК-і ${e} %, цикл ішінде ол ${fmt(A)} кДж жұмыс жасайды. Қозғалтқыш цикл ішінде қыздырғыштан қандай жылу мөлшерін алады?`);P.given=`η = ${e} %, A = ${fmt(A)} ${kJ}`;
    P.steps=[st(L('Из η = A/Q₁:','η = A/Q₁ өрнегінен:'),`Q₁ = ${frac('A','η')} = ${frac(fmt(A),fmt(e/100))} = ${Q1} ${kJ}`)];P.trap={v:A*e/100,msg:L('Делите работу на КПД (в долях).','Жұмысты ПӘК-ке (үлеспен) бөліңіз.')};P.wr=[A*e/100,A+e,Q2];}
  P.fig=(svg,show)=>figEngine(svg,{Q1:mode==='Q1'&&!show?'Q₁ = ?':`Q₁ = ${Q1} ${kJ}`,Q2:mode==='Q2'&&!show?'Q₂ = ?':mode==='eta'||mode==='Q2'?`Q₂ = ${fmt(Q2)} ${kJ}`:'Q₂',A:mode==='A'&&!show?'A = ?':mode==='Q2'||mode==='Q1'||show||mode==='A'?`A = ${fmt(A)} ${kJ}`:'A',eta:mode==='eta'?(show?`η = ${e} %`:'η = ?'):`η = ${e} %`});
  return P;}
function pCarnot(){const P={cat:'carnot'};const mode=pick(['eta','T1','T2','etaC']);
  if(mode==='etaC'){const t1=pick([127,227,327,427,527,727]),t2=pick([17,27,37,47,77]);const T1=C2K(t1),T2=C2K(t2),e=(T1-T2)/T1*100;P.ans=e;P.unit='%';P.text=L(`Температура нагревателя идеальной тепловой машины ${t1} °C, холодильника ${t2} °C. Найдите максимальный КПД.`,`Идеал жылу машинасының қыздырғышының температурасы ${t1} °C, суытқыштікі ${t2} °C. Ең үлкен ПӘК-ті табыңыз.`);P.given=`t₁ = ${t1} °C, t₂ = ${t2} °C`;

    P.fig=(svg,show)=>figEngine(svg,{T1:`T₁ = ${T1} K`,T2:`T₂ = ${T2} K`,eta:show?`η ≈ ${fmt(e,3)} %`:'η = ?'});return P;}
  const T1=pick([400,500,600,800,1000]),e=pick([20,25,30,40,50,60]);const T2=T1*(1-e/100);
  if(mode==='eta'){P.ans=e;P.unit='%';P.text=L(`Идеальная тепловая машина работает с нагревателем при ${T1} К и холодильником при ${fmt(T2)} К. Найдите её КПД.`,`Идеал жылу машинасы ${T1} К қыздырғышпен және ${fmt(T2)} К суытқышпен жұмыс істейді. Оның ПӘК-ін табыңыз.`);P.given=`T₁ = ${T1} ${KK}, T₂ = ${fmt(T2)} ${KK}`;P.steps=[st(L('КПД идеальной машины (цикл Карно):','Идеал машинаның ПӘК-і (Карно циклі):'),`η = ${frac('T₁ − T₂','T₁')} = ${frac(`${T1} − ${fmt(T2)}`,T1)} = ${e} %`)];P.trap={v:T2/T1*100,msg:L('η = (T₁ − T₂)/T₁.','η = (T₁ − T₂)/T₁.')};P.wr=[T2/T1*100,(T1-T2)/T2*100,e/2];}
  else if(mode==='T2'){P.ans=T2;P.unit=KK;P.text=L(`КПД идеальной тепловой машины ${e} %, температура нагревателя ${T1} К. Найдите температуру холодильника.`,`Идеал жылу машинасының ПӘК-і ${e} %, қыздырғыштың температурасы ${T1} К. Суытқыштың температурасын табыңыз.`);P.given=`η = ${e} %, T₁ = ${T1} ${KK}`;P.steps=[st(L('Из η = 1 − T₂/T₁:','η = 1 − T₂/T₁ өрнегінен:'),`T₂ = T₁(1 − η) = ${T1} · (1 − ${fmt(e/100)}) = ${fmt(T2)} ${KK}`)];P.trap={v:T1*e/100,msg:L('T₂ = T₁(1 − η).','T₂ = T₁(1 − η).')};P.wr=[T1*e/100,T1-e,T2/2];}
  else{P.ans=T1;P.unit=KK;P.text=L(`Температура холодильника идеальной тепловой машины ${fmt(T2)} К, КПД ${e} %. Найдите температуру нагревателя.`,`Идеал жылу машинасының суытқышының температурасы ${fmt(T2)} К, ПӘК-і ${e} %. Қыздырғыштың температурасын табыңыз.`);P.given=`T₂ = ${fmt(T2)} ${KK}, η = ${e} %`;P.steps=[st(L('Из η = 1 − T₂/T₁:','η = 1 − T₂/T₁ өрнегінен:'),`T₁ = ${frac('T₂','1 − η')} = ${frac(fmt(T2),fmt(1-e/100))} = ${T1} ${KK}`)];P.trap={v:T2*(1+e/100),msg:L('T₁ = T₂/(1 − η).','T₁ = T₂/(1 − η).')};P.wr=[T2*(1+e/100),T2/(e/100),T1*2];}
  P.fig=(svg,show)=>figEngine(svg,{T1:mode==='T1'&&!show?'T₁ = ?':`T₁ = ${T1} K`,T2:mode==='T2'&&!show?'T₂ = ?':`T₂ = ${fmt(T2)} K`,eta:mode==='eta'&&!show?'η = ?':`η = ${e} %`});
  return P;}
function pFuel(){const P={cat:'fuel'};const f=pick(FUEL().slice(0,3));const mode=pick(['m','eta','N']);
  if(mode==='m'){const N=pick([20,30,40,50,60,100]),t=pick([1,2,3]),e=pick([25,30,35,40]);const A=N*1000*t*3600,m=A/(e/100*f.q);P.ans=m;P.unit=kgU;P.text=L(`Двигатель мощностью ${N} кВт работает ${t} ч. Его КПД ${e} %. Сколько топлива (${f.n}, q = ${f.qh} Дж/кг) он расходует?`,`Қуаты ${N} кВт қозғалтқыш ${t} сағ жұмыс істейді. Оның ПӘК-і ${e} %. Ол қанша отын (${f.n}, q = ${f.qh} Дж/кг) жұмсайды?`);P.given=`N = ${N} ${kW}, t = ${t} ${L('ч','сағ')} = ${t*3600} ${ss}, η = ${e} %, q = ${f.qh} ${L('Дж/кг','Дж/кг')}`;
    P.steps=[st(L('Полезная работа:','Пайдалы жұмыс:'),`A = Nt = ${N*1000} · ${t*3600} = ${fmt(A,4)} ${JJ}`),st(L('Затраченная энергия топлива Q = qm, КПД η = A/(qm):','Жұмсалған отын энергиясы Q = qm, ПӘК η = A/(qm):'),`m = ${frac('A','ηq')} = ${frac(fmt(A,4),`${fmt(e/100)} · ${f.qh}`)} ≈ ${fmt(m,4)} ${kgU}`)];P.trap={v:A/f.q,msg:L('Учтите КПД: топлива нужно больше.','ПӘК-ті ескеріңіз: отын көбірек керек.')};P.wr=[A/f.q,m*e/100,m*2];}

    P.steps=[st(L('Энергия, выделившаяся при сгорании:','Жанғанда бөлінген энергия:'),`Q = qm = ${f.qh} · ${m} = ${fmt(f.q*m/1e6,4)} ${MJ}`),st(L('КПД:','ПӘК:'),`η = ${frac('A','Q')} = ${frac(fmt(A/1e6,4),fmt(f.q*m/1e6,4))} = ${fmt(e,3)} %`)];P.trap={v:A/f.q*100,msg:L('Q = qm — умножьте на массу топлива.','Q = qm — отын массасына көбейтіңіз.')};P.wr=[100-e,e/2,e*2];}

function solveUI(root,st,P,redraw,work){
  const N=P.steps.length,n=TEACH?N:Math.min(st.shown,N),ansOn=TEACH||st.ans||n>=N;

    (P.scale&&P.scale!==1?`<p class="muted" style="font-size:.85rem">${L('Введите множитель перед ·10ⁿ или всё число, например 1,5e-7.','·10ⁿ алдындағы көбейткішті немесе бүкіл санды енгізіңіз, мысалы 1,5e-7.')}</p>`:'')+
    (last===undefined?'':solved?`<p class="fb ok">${L('Верно!','Дұрыс!')} ${st.tries.length===1?L('С первой попытки.','Бірінші әрекеттен.'):''}</p>`:`<p class="fb bad">${trapHit?P.trap.msg:L('Пока неверно. Проверьте вычисления и единицы измерения или откройте подсказку.','Әзірге қате. Есептеулер мен өлшем бірліктерін тексеріңіз немесе кеңесті ашыңыз.')} (${L('попыток','әрекет')}: ${st.tries.length})</p>`))+

  const c={max:'1',min:'3',dU:L('одинаково во всех','барлығында бірдей')}[k];return mkQ('gr',q+`<div class="paper-grid" style="max-width:420px;margin-top:10px">${fs}</div>`,c,['1','2','3',L('одинаково во всех','барлығында бірдей')].filter(x=>x!==c),k==='dU'?L('ΔU зависит только от начального и конечного состояний.','ΔU тек бастапқы және соңғы күйлерге тәуелді.'):L('Работа — площадь под графиком: наибольшая у пути 1, наименьшая у пути 3.','Жұмыс — график астындағы аудан: 1-жолда ең үлкен, 3-жолда ең аз.'));}
function grSign(){const k=pick(['exp','comp','iso']);const pts=k==='exp'?lin([1,200],[4,200]):k==='comp'?lin([4,150],[1,150]):lin([2.5,80],[2.5,280]);const fs=svgStr({W:560,H:360},s=>pvFig(s,{V1:5,p1:320,segs:[{pts}]}));
  const c={exp:L('положительна','оң'),comp:L('отрицательна','теріс'),iso:L('равна нулю','нөлге тең')}[k];return mkQ('gr',L('Каков знак работы газа в процессе, изображённом на графике?','Графикте бейнеленген процесте газ жұмысының таңбасы қандай?')+`<div class="paper-grid" style="max-width:420px;margin-top:10px">${fs}</div>`,c,[L('положительна','оң'),L('отрицательна','теріс'),L('равна нулю','нөлге тең'),L('нельзя определить','анықтау мүмкін емес')].filter(x=>x!==c),L('Расширение — A′ &gt; 0, сжатие — A′ &lt; 0, V = const — A′ = 0.','Ұлғаю — A′ &gt; 0, сығылу — A′ &lt; 0, V = const — A′ = 0.'));}
function grStroke(){const ph=pick([0,1,2,3]);const fs=svgStr({W:300,H:440},s=>figICE(s,{th:ph*180+90,eps:8,W:300,H:440}));const nm=[L('впуск','кіріс'),L('сжатие','сығу'),L('рабочий ход','жұмыстық жүріс'),L('выпуск','шығыс')];
  return mkQ('gr',L('Какой такт двигателя изображён на рисунке? (стрелка — направление движения поршня)','Суретте қозғалтқыштың қай тактісі бейнеленген? (нұсқар — поршень қозғалысының бағыты)')+`<div class="paper-grid" style="max-width:260px;margin-top:10px">${fs}</div>`,nm[ph],nm.filter((x,i)=>i!==ph),L('Впуск — открыт впускной клапан, поршень вниз; сжатие — клапаны закрыты, поршень вверх; рабочий ход — после вспышки, поршень вниз; выпуск — открыт выпускной клапан, поршень вверх.','Кіріс — кіріс клапаны ашық, поршень төмен; сығу — клапандар жабық, поршень жоғары; жұмыстық жүріс — тұтанғаннан кейін, поршень төмен; шығыс — шығыс клапаны ашық, поршень жоғары.'));}
const GEN={th:()=>pickQ('th',THQ()),gr:()=>pick([grPaths,grSign,grStroke])(),calc:()=>qFromP('calc',PGEN[pick(['U','work','first','first'])]()),eng:()=>rnd()<.45?pickQ('eng',ENGQ()):qFromP('eng',PGEN[pick(['eta','carnot','fuel'])]())};
const build=rec=>withSeed(rec.seed,()=>GEN[rec.cat==='all'?pick(Object.keys(GEN)):rec.cat]());
/* ================= ТРЕНАЖЁР И ТЕСТ ================= */
const LET='АБВГ';
function renderQ(box,q,chosen,{onAnswer,nextLabel,onNext}){
  box.innerHTML=`<div class="qcard"><div class="qcat">${q.cat}</div><div class="qtext">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${i}"><span class="k">${LET[i]}</span><span>${o}</span></button>`).join('')}</div><div class="fb"></div></div>`;
  const btns=[...box.querySelectorAll('.opt')];
  const showFb=(i,focus)=>{const ok=i===q.ans;btns.forEach(x=>{x.disabled=true;});btns[q.ans].classList.add('right');if(!ok)btns[i].classList.add('wrong');
    const fb=box.querySelector('.fb');fb.innerHTML=`<div class="expl ${ok?'ok':'no'}"><b>${ok?L('Верно!','Дұрыс!'):L('Неверно. Правильный ответ: ','Қате. Дұрыс жауап: ')+LET[q.ans]}</b>${q.ex}</div>`;
    const nb=document.createElement('button');nb.className='btn';nb.textContent=nextLabel();nb.style.marginTop='14px';nb.addEventListener('click',onNext);fb.appendChild(nb);if(focus)nb.focus({preventScroll:true});};
  if(chosen!=null)showFb(chosen,false);
  btns.forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.o;showFb(i,true);onAnswer(i===q.ans,i);}));}
const T={cat:'all',done:0,ok:0,streak:0,best:0,rec:null,chosen:null};
try{T.best=+localStorage.getItem('thd-best')||0;}catch(e){}
function renderTrCat(){const C_=[['all',L('Все темы','Барлық тақырыптар')],...Object.entries(CATN())];$('#trCat').innerHTML=C_.map(([k,l])=>`<button data-c="${k}" aria-pressed="${k===T.cat}">${l}</button>`).join('');}
$('#trCat').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;T.cat=b.dataset.c;[...$('#trCat').children].forEach(x=>x.setAttribute('aria-pressed',x===b));nextTrain();});
function stats(){$('#sDone').textContent=T.done;$('#sOk').textContent=T.ok;$('#sStreak').textContent=T.streak;$('#sBest').textContent=T.best;}
function drawTrain(){renderQ($('#trBox'),build(T.rec),T.chosen,{nextLabel:()=>L('Следующее задание','Келесі тапсырма'),onNext:nextTrain,onAnswer:(ok,i)=>{T.chosen=i;T.done++;if(ok){T.ok++;T.streak++;if(T.streak>T.best){T.best=T.streak;try{localStorage.setItem('thd-best',T.best);}catch(e){}}}else T.streak=0;stats();}});}
function nextTrain(){T.rec={cat:T.cat,seed:newSeed()};T.chosen=null;drawTrain();}
const TT={phase:'intro',recs:[],i:0,ok:0,chosen:[]};
function drawTest(){if(TT.phase==='intro')testIntro();else if(TT.phase==='q')testStep();else testEnd();}
function testIntro(){let best=null;try{best=localStorage.getItem('thd-test');}catch(e){}
  $('#testBox').innerHTML=`<div class="qcard"><h2>${L('Итоговый тест','Қорытынды тест')}</h2><p>${L('10 заданий: внутренняя энергия, работа газа, первый и второй законы термодинамики, p–V диаграммы, тепловые двигатели, КПД и цикл Карно. После каждого ответа — разбор, в конце — итог и список ошибок.','10 тапсырма: ішкі энергия, газ жұмысы, термодинамиканың бірінші және екінші заңдары, p–V диаграммалары, жылу қозғалтқыштары, ПӘК және Карно циклі. Әр жауаптан кейін талдау, соңында қорытынды және қателер тізімі.')}</p>
    ${best!==null?`<p class="stat">${L('Ваш лучший результат','Ең жақсы нәтижеңіз')}: <b>${best} / 10</b></p>`:''}<button class="btn" id="tStart">${L('Начать тест','Тестті бастау')}</button></div>`;
  $('#tStart').addEventListener('click',startTest);}
function startTest(){TT.recs=shuffle(['th','th','gr','gr','calc','calc','calc','eng','eng','eng']).map(c=>({cat:c,seed:newSeed()}));TT.i=0;TT.ok=0;TT.chosen=[];TT.phase='q';testStep();}
function testStep(){const q=build(TT.recs[TT.i]),box=$('#testBox'),ch=TT.chosen[TT.i];
  box.innerHTML=`<div class="row" style="margin-bottom:10px"><span class="stat">${L('Задание','Тапсырма')} <b>${TT.i+1}</b> / 10</span><span class="stat">${L('Верно','Дұрыс')}: <b id="tOk">${TT.ok}</b></span></div><div class="progress" style="margin-bottom:16px"><i style="width:${(TT.i+(ch!=null?1:0))*10}%"></i></div><div id="tQ"></div>`;
  renderQ($('#tQ'),q,ch,{nextLabel:()=>TT.i<9?L('Дальше','Әрі қарай'):L('Показать результат','Нәтижені көрсету'),onNext:()=>{TT.i++;if(TT.i<10)testStep();else{TT.phase='end';testEnd();}},
    onAnswer:(ok,i)=>{TT.chosen[TT.i]=i;if(ok)TT.ok++;box.querySelector('.progress i').style.width=(TT.i+1)*10+'%';$('#tOk').textContent=TT.ok;}});}
function testEnd(){const s=TT.ok;const msg=s>=9?L('Отлично! Тема усвоена.','Өте жақсы! Тақырып меңгерілді.'):s>=7?L('Хорошо. Повторите задания, где были ошибки.','Жақсы. Қате жіберген тапсырмаларды қайталаңыз.'):s>=5?L('Неплохо, но стоит потренироваться ещё.','Жаман емес, бірақ тағы жаттығу керек.'):L('Вернитесь к теории и моделям, затем потренируйтесь ещё.','Теория мен модельдерге қайта оралып, сосын тағы жаттығыңыз.');
  try{const prev=localStorage.getItem('thd-test');if(prev===null||s>+prev)localStorage.setItem('thd-test',s);}catch(e){}
  const wrong=TT.recs.map((r,i)=>({q:build(r),c:TT.chosen[i]})).filter(x=>x.c!==x.q.ans);
  $('#testBox').innerHTML=`<div class="qcard"><div class="qcat">${L('Результат','Нәтиже')}</div><div class="score">${s} <span style="font-size:1.4rem;color:var(--muted)">/ 10</span></div><p>${msg}</p>
    ${wrong.length?`<h3>${L('Разбор ошибок','Қателерді талдау')}</h3><div class="review">${wrong.map(({q,c})=>`<div><span class="qcat">${q.cat}</span><span>${q.q}</span><span class="bad-a">${L('Ваш ответ','Сіздің жауабыңыз')}: ${c!=null?q.opts[c]:'—'}</span><span>${L('Правильный ответ','Дұрыс жауап')}: ${q.opts[q.ans]}</span><span style="color:var(--muted)">${q.ex}</span></div>`).join('')}</div>`:''}
    <div class="row"><button class="btn" id="tAgain">${L('Пройти ещё раз','Қайта тапсыру')}</button><button class="btn ghost" id="tTrain">${L('Перейти в тренажёр','Жаттықтырғышқа өту')}</button></div></div>`;
  $('#tAgain').addEventListener('click',startTest);$('#tTrain').addEventListener('click',()=>showTab('train'));}

/* ================= переключатели ================= */
function renderAll(){applyUI();renderTheory();cyControls();cyDraw();icControls();icDraw();drawProb();renderTrCat();stats();drawTrain();drawTest();}
$('#langSw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.lang===LANG)return;LANG=b.dataset.lang;try{localStorage.setItem('thd-lang',LANG);}catch(e){}renderAll();});
function setSize(px){document.documentElement.style.fontSize=px+'px';[...$('#sizeSw').children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.sz===px));}
$('#sizeSw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const px=+b.dataset.sz;setSize(px);try{localStorage.setItem('thd-size',px);}catch(e){}});
(function(){let px=22;try{const v=+localStorage.getItem('thd-size');if([16,22,28].includes(v))px=v;}catch(e){}setSize(px);})();
const mq=matchMedia('(prefers-color-scheme: dark)');
function syncTheme(){const t=document.documentElement.dataset.theme||(mq.matches?'dark':'light');[...$('#themeSw').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===t));}
$('#themeSw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.documentElement.dataset.theme=b.dataset.th;try{localStorage.setItem('thd-theme',b.dataset.th);}catch(e){}syncTheme();});
try{const t=localStorage.getItem('thd-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
mq.addEventListener('change',syncTheme);new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
PR.seed=newSeed();T.rec={cat:'all',seed:newSeed()};
renderAll();syncTheme();
(function(){const h=location.hash.slice(1);let t=TABS.includes(h)?h:null;if(!t){try{const s=localStorage.getItem('thd-tab');if(TABS.includes(s))t=s;}catch(e){}}showTab(t||'theory');})();

</script>
<style>

<script>
(function(){
  const cv=document.getElementById('penCv'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const LNG=()=>(typeof LANG!=='undefined'&&LANG==='kz')?1:0;
  const TIP={penMain:['Ручка: рисовать на экране (Esc — выключить)','Қалам: экранға жазу (Esc — өшіру)'],penEr:['Ластик','Өшіргіш'],penLine:['Прямая линия (линейка): потяните от начала к концу','Түзу сызық (сызғыш): басынан соңына дейін тартыңыз'],penCirc:['Окружность (циркуль): нажмите в центре и потяните до нужного радиуса','Шеңбер (циркуль): центрін басып, қажетті радиусқа дейін тартыңыз'],penUndo:['Отменить последнее','Соңғысын болдырмау'],penClr:['Стереть всё на этой вкладке','Осы беттегінің бәрін өшіру'],
    ink:['Чёрный','Қара'],red:['Красный','Қызыл'],blue:['Синий','Көк'],green:['Зелёный','Жасыл'],orange:['Оранжевый','Қызғылт сары'],violet:['Фиолетовый','Күлгін'],w3:['Тонкая линия','Жіңішке сызық'],w6:['Средняя линия','Орташа сызық'],w12:['Толстая линия','Жуан сызық']};
  const COL={ink:['#1c2746','#f1f4fb'],red:['#dc2626','#ff6b6b'],blue:['#2563eb','#7aa2ff'],green:['#15803d','#4ade80'],orange:['#ea580c','#fb923c'],violet:['#7c3aed','#c4a5ff']};
  const mqD=matchMedia('(prefers-color-scheme: dark)');
  const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mqD.matches;};
  const st={on:false,color:'red',w:6,er:false,tool:null,pages:{},cleared:{},cur:null};
  const key=()=>{const t=document.querySelector('[role="tab"][aria-selected="true"]');return t?(t.id||t.dataset.tab||t.textContent):'main';};
  const list=()=>st.pages[key()]||(st.pages[key()]=[]);
  let dpr=1;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);redraw();}
  function stroke(s){if(s.p.length===0)return;ctx.save();ctx.globalCompositeOperation=s.er?'destination-out':'source-over';
    ctx.strokeStyle=s.er?'#000':COL[s.c][dark()?1:0];ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';
    const ox=scrollX,oy=scrollY,p=s.p;
    if(s.ci){const r=p.length>1?Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]):0;ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,Math.max(r,1),0,2*Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,Math.max(2,s.w/2),0,7);ctx.fill();

<style id="cards-css">
.ck-top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

.ck-hint{color:var(--muted);font-size:.92rem;line-height:1.5}
.ck-list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.ck-it{display:flex;align-items:center;gap:12px;min-height:3em;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1.45;font-size:1.02rem;position:relative}
.ck-it .ck-n{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-family:var(--f-mono,monospace);font-size:.85rem}
.ck-it .ck-h{flex:none;margin-left:auto;color:var(--muted);font-size:1.3rem;line-height:1}
.ck-it.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ck-it.drag{opacity:.35}
.ck-it.ok{border-color:var(--ok);background:var(--ok-soft)}
.ck-it.no{border-color:var(--bad);background:var(--bad-soft)}
.ck-ghost{position:fixed;z-index:950;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgba(10,20,50,.3);transform:rotate(-1.5deg);cursor:grabbing}
.ck-mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}

.ck-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px;align-items:stretch}
.ck-term{display:flex;align-items:center;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-weight:700;line-height:1.45;min-height:3em}
.ck-slot{min-height:3.2em;border:2px dashed var(--line);border-radius:12px;padding:4px;display:flex;align-items:stretch}
.ck-slot.ov,.ck-pool.ov{border-color:var(--accent);background:var(--accent-soft)}

.ck-slot.ok{border-style:solid;border-color:var(--ok)}.ck-slot.no{border-style:solid;border-color:var(--bad)}

.ck-term:has(.ckfig){background:var(--surface);border:1px solid var(--line);justify-content:center;padding:6px}
.ck-hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:stretch}
.ck-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.ck-col .ck-term{flex:1;justify-content:center;padding:6px}
.ck-col .ck-slot{min-height:5.2em}
.ck-col .ck-slot>.ck-it,.ck-pool.h>.ck-it{font-size:.9rem;padding:8px 10px;gap:8px}
.ck-pool.h{flex-direction:row;flex-wrap:wrap;margin-top:6px;border-color:var(--line);min-height:4em}
.ck-pool.h>.ck-it{flex:1 1 210px;max-width:340px}
.ck-col .ckfig{max-width:210px}

.ck-fb.ok{background:var(--ok-soft);color:var(--ok)}.ck-fb.no{background:var(--bad-soft);color:var(--bad)}

  const T=v=>Array.isArray(v)?v[lang()]:v;
  const U=k=>({tab:['Карточки','Карточкалар'],ord:['Порядок','Реттілік'],mat:['Соответствие','Сәйкестік'],
    oh:['Перетащите карточки так, чтобы они стояли в правильном порядке (сверху вниз). Можно и без перетаскивания: нажмите на одну карточку, затем на другую — они поменяются местами.','Карточкаларды дұрыс ретпен (жоғарыдан төмен) орналастырыңыз. Сүйремей-ақ болады: бір карточканы, сосын екіншісін басыңыз — олар орын ауыстырады.'],
    mh:['Перетащите карточку справа в пустую ячейку напротив подходящего понятия. Можно и нажатием: выберите карточку, затем ячейку.','Оң жақтағы карточканы сәйкес ұғымның қарсысындағы бос ұяшыққа сүйреңіз. Басу арқылы да болады: карточканы, сосын ұяшықты таңдаңыз.'],
    mhh:['Перетащите подпись снизу в ячейку под подходящим рисунком. Можно и нажатием: выберите подпись, затем ячейку.','Төмендегі жазуды сәйкес суреттің астындағы ұяшыққа сүйреңіз. Басу арқылы да болады: жазуды, сосын ұяшықты таңдаңыз.'],pool:['Карточки','Карточкалар'],check:['Проверить','Тексеру'],show:['Показать ответ','Жауапты көрсету'],mix:['Перемешать','Араластыру'],
    all:['Всё верно! Молодцы!','Бәрі дұрыс! Жарайсыңдар!'],part:['Верно: ','Дұрыс: '],fill:['Заполните все ячейки.','Барлық ұяшықты толтырыңыз.']}[k][lang()]);
  const $=s=>document.querySelector(s);
  const nav=document.querySelector('nav.tabs'),main=document.querySelector('main');if(!nav||!main)return;
  const tb=document.createElement('button');tb.setAttribute('role','tab');tb.id='t-cards';tb.dataset.tab='cards';tb.setAttribute('aria-selected','false');
  const testTab=nav.querySelector('#t-test');nav.insertBefore(tb,testTab||null);
  const pane=document.createElement('div');pane.id='p-cards';pane.className='pane';pane.hidden=true;main.appendChild(pane);
  const show=on=>{if(on){main.querySelectorAll(':scope > [id^="p-"]').forEach(p=>{if(p!==pane)p.hidden=true;});nav.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b===tb));}pane.hidden=!on;if(!on)tb.setAttribute('aria-selected','false');};
  nav.addEventListener('click',e=>{const b=e.target.closest('[role=tab]');if(!b)return;show(b===tb);});
  let cur=0;const st={};
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  function state(i){const d=DATA[i];if(st[i])return st[i];const n=d.t==='order'?d.items.length:d.pairs.length;let p;do{p=shuffle([...Array(n).keys()]);}while(n>1&&p.every((v,k)=>v===k));
    return st[i]=d.t==='order'?{ord:p}:{slot:Array(n).fill(-1),pool:p};}
  function render(){tb.textContent=U('tab');let no=0,nm=0;
    pane.innerHTML=`<div class="ck-top">${DATA.map((d,i)=>`<button class="${''}" data-ck="${i}" aria-pressed="${i===cur}">${d.t==='order'?U('ord')+' '+(++no):U('mat')+' '+(++nm)}</button>`).join('')}</div><div class="ck-card" id="ckBox"></div>`;
    pane.querySelector('.ck-top').classList.add('seg');pane.querySelectorAll('[data-ck]').forEach(b=>b.addEventListener('click',()=>{cur=+b.dataset.ck;render();}));draw();}
  function btns(){return `<div class="ck-btns"><button class="btn" data-a="check">${U('check')}</button><button class="btn ghost" data-a="show">${U('show')}</button><button class="btn ghost" data-a="mix">${U('mix')}</button></div><div id="ckFb"></div>`;}
  const item=(html,i,num)=>`<div class="ck-it" data-i="${i}">${num!=null?`<span class="ck-n">${num}</span>`:''}<span>${html}</span><span class="ck-h">⠿</span></div>`;
  function draw(){const d=DATA[cur],s=state(cur),box=$('#ckBox');
    if(d.t==='order'){box.innerHTML=`<h3>${T(d.title)}</h3><p class="ck-hint">${T(d.hint)||U('oh')}</p><div class="ck-list" id="ckL">${s.ord.map((k,j)=>item(T(d.items[k]),k,j+1)).join('')}</div>${btns()}`;}
    else if(d.lay==='h'){box.innerHTML=`<h3>${T(d.title)}</h3><p class="ck-hint">${T(d.hint)||U('mhh')}</p><div class="ck-hgrid">${d.pairs.map((p,k)=>`<div class="ck-col"><div class="ck-term">${T(p[0])}</div><div class="ck-slot" data-s="${k}">${s.slot[k]>=0?item(T(d.pairs[s.slot[k]][1]),s.slot[k]):''}</div></div>`).join('')}</div><div class="ck-pt">${U('pool')}</div><div class="ck-pool h" id="ckP">${s.pool.map(k=>item(T(d.pairs[k][1]),k)).join('')}</div>${btns()}`;}
    else{box.innerHTML=`<h3>${T(d.title)}</h3><p class="ck-hint">${T(d.hint)||U('mh')}</p><div class="ck-mgrid"><div style="display:flex;flex-direction:column;gap:10px">${d.pairs.map((p,k)=>`<div class="ck-row"><div class="ck-term">${T(p[0])}</div><div class="ck-slot" data-s="${k}">${s.slot[k]>=0?item(T(d.pairs[s.slot[k]][1]),s.slot[k]):''}</div></div>`).join('')}</div><div><div class="ck-pt">${U('pool')}</div><div class="ck-pool" id="ckP">${s.pool.map(k=>item(T(d.pairs[k][1]),k)).join('')}</div></div></div>${btns()}`;}
    box.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));bind();}
  function readState(){const d=DATA[cur],s=state(cur);if(d.t==='order'){s.ord=[...$('#ckL').children].map(e=>+e.dataset.i);}else{s.slot=[...pane.querySelectorAll('.ck-slot')].map(sl=>{const c=sl.querySelector('.ck-it');return c?+c.dataset.i:-1;});s.pool=[...$('#ckP').children].map(e=>+e.dataset.i);}}
  function act(a){const d=DATA[cur],s=state(cur),n=d.t==='order'?d.items.length:d.pairs.length;
    if(a==='mix'){delete st[cur];draw();return;}
    if(a==='show'){if(d.t==='order')s.ord=[...Array(n).keys()];else{s.slot=[...Array(n).keys()];s.pool=[];}draw();act('check');return;}
    readState();let ok=0;
    if(d.t==='order'){[...$('#ckL').children].forEach((e,j)=>{const g=+e.dataset.i===j;ok+=g;e.classList.toggle('ok',g);e.classList.toggle('no',!g);e.querySelector('.ck-n').textContent=j+1;});}
    else{if(s.slot.some(v=>v<0)){$('#ckFb').innerHTML=`<div class="ck-fb no">${U('fill')}</div>`;return;}pane.querySelectorAll('.ck-slot').forEach((sl,k)=>{const g=s.slot[k]===k;ok+=g;sl.classList.toggle('ok',g);sl.classList.toggle('no',!g);const c=sl.querySelector('.ck-it');c.classList.toggle('ok',g);c.classList.toggle('no',!g);});}
    $('#ckFb').innerHTML=ok===n?`<div class="ck-fb ok">${U('all')}</div>`:`<div class="ck-fb no">${U('part')}${ok} / ${n}</div>`;}
  function clearMarks(){pane.querySelectorAll('.ok,.no').forEach(e=>e.classList.remove('ok','no'));const f=$('#ckFb');if(f)f.innerHTML='';}
  let sel=null;
  function bind(){sel=null;pane.querySelectorAll('#ckBox .ck-it').forEach(c=>c.addEventListener('pointerdown',down));
    pane.querySelectorAll('.ck-slot,#ckP').forEach(z=>z.addEventListener('click',e=>{if(!sel||e.target.closest('.ck-it'))return;place(sel,z);sel.classList.remove('sel');sel=null;}));}
  function renum(){const l=$('#ckL');if(l)[...l.children].forEach((e,j)=>{const n=e.querySelector('.ck-n');if(n)n.textContent=j+1;});}
  function place(card,zone){const from=card.parentNode;if(zone===from)return;if(zone.classList.contains('ck-slot')){const old=zone.querySelector('.ck-it');if(old&&old!==card){if(from.classList.contains('ck-slot'))from.appendChild(old);else $('#ckP').appendChild(old);}}zone.appendChild(card);clearMarks();readState();}
  function swap(a,b){const pa=a.parentNode,pb=b.parentNode,na=a.nextSibling===b?a:a.nextSibling;pb.insertBefore(a,b);pa.insertBefore(b,na);}
  function down(e){if(e.button>0)return;const card=e.currentTarget;e.preventDefault();const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;const r=card.getBoundingClientRect();const ox=sx-r.left,oy=sy-r.top;const isOrd=!!card.closest('#ckL');let over=null;
    const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;
      if(!moved){moved=true;ghost=card.cloneNode(true);ghost.classList.add('ck-ghost');ghost.classList.remove('sel');ghost.style.width=r.width+'px';document.body.appendChild(ghost);card.classList.add('drag');}
      ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';
      if(isOrd){const l=$('#ckL');const sib=[...l.children].filter(x=>x!==card);let ref=null;for(const s of sib){const b=s.getBoundingClientRect();if(ev.clientY<b.top+b.height/2){ref=s;break;}}if(ref!==card.nextSibling)l.insertBefore(card,ref);renum();}
      else{const el=document.elementFromPoint(ev.clientX,ev.clientY);const z=el&&el.closest('.ck-slot,#ckP');if(over&&over!==z)over.classList.remove('ov');over=z;if(z)z.classList.add('ov');}
      const vh=innerHeight;if(ev.clientY<60)scrollBy(0,-12);else if(ev.clientY>vh-60)scrollBy(0,12);};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(ghost)ghost.remove();card.classList.remove('drag');if(over)over.classList.remove('ov');
      if(!moved){ // нажатие: выбрать / поменять местами / поставить
        if(sel&&sel!==card){if(isOrd||sel.closest('#ckL'))swap(sel,card);else{const za=sel.parentNode,zb=card.parentNode;if(za!==zb){zb.classList.contains('ck-slot')?place(sel,zb):place(card,za);}}sel.classList.remove('sel');sel=null;clearMarks();renum();readState();}
        else if(sel===card){card.classList.remove('sel');sel=null;}else{sel=card;card.classList.add('sel');}return;}
      if(isOrd){clearMarks();readState();return;}
      if(over)place(card,over);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);}
  render();
  document.addEventListener('click',e=>{if(e.target.closest('#langSw'))setTimeout(render,0);});
})();
</script>
<!--cards-end-->
</html>
